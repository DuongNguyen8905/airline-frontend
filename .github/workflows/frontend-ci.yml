name: Frontend CI Pipeline

# 1. Trigger: Khi nào pipeline này được kích hoạt?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 2. Jobs: Công việc cần thực hiện
jobs:
  build-and-verify:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest  # Máy ảo do GitHub cung cấp (Ubuntu miễn phí)

    steps:
      # Bước 1: Clone mã nguồn vào máy ảo GitHub
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt công cụ quản lý gói pnpm
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Bước 3: Cài đặt môi trường Node.js 20 và kích hoạt cache để chạy cực nhanh
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Bước 4: Cài đặt các thư viện trong package.json
      - name: 🚚 Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Bước 5: Chạy lệnh build kiểm tra cú pháp và tính toàn vẹn của mã nguồn
      - name: 🏗️ Run build check
        run: pnpm run build
